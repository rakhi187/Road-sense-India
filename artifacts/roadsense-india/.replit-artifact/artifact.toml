kind = "web"
previewPath = "/"
title = "RoadSense India"
description = "Interactive road intelligence simulator for Indian routes, with mapped route playback and provider-based ETA verification."
version = "1.0.0"
id = "artifacts/roadsense-india"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24867

[services.development]
run = "pnpm --filter @workspace/roadsense-india run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/roadsense-india", "run", "build" ]
serve = "static"
publicDir = "artifacts/roadsense-india/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24867"
BASE_PATH = "/"
